name: Real desktop input and screenshot gate

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/veil/**'
      - 'assets/game/kenney/**'
      - '.github/workflows/desktop-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virtual-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install virtual desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth
      - name: Compile Java 17 game and test
        run: |
          mkdir -p build/classes
          javac --release 17 -encoding UTF-8 -d build/classes src/main/java/veil/*.java
      - name: Render actual Swing window and drive keyboard/mouse
        run: xvfb-run -a -s "-screen 0 1280x900x24" timeout 40s java -Djava.awt.headless=false -cp build/classes veil.DesktopInputTest
      - name: Upload actual desktop screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malefic-virtual-desktop-input
          path: build/test-visuals/desktop-input.png
          if-no-files-found: warn
