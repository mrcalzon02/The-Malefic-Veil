name: Desktop release package
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: malefic-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Acquire verified GGBot CC0 car atlas source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/game/ggbot
          curl -fL --retry 3 'https://opengameart.org/sites/default/files/psx_style_cars_by_ggbot_august2023.zip' -o assets/game/ggbot/psx-style-cars.zip
          echo 'db67b0b0fbaa02454a5d000dc9ec1cc53f360e8f41ab44f3fb1c7e8f71e699e4  assets/game/ggbot/psx-style-cars.zip' | sha256sum -c -
      - name: Compile Java 17
        run: |
          mkdir -p build/classes build/package
          javac --release 17 -encoding UTF-8 -d build/classes src/main/java/veil/*.java
      - name: Release tests
        run: |
          set -e
          python3 tools/validate_economy_csv.py
          for test in WorldSelfTest CityLayoutTest ArenaSystemsTest SurvivalCraftingTest CraftingEraRegistryTest IndustrialWorkstationTest CargoHaulageTest CityLootEconomyTest SettlementSustenanceTest LoadedConvoyRiskTest ReleaseCatalogTest DesktopUpdaterTest DesktopDiagnosticsTest GGBotCarPackTest WorldCreationConfigTest WorldCreationEndToEndTest LanSmokeTest RenderSmokeTest; do
            java -Djava.awt.headless=true -cp build/classes "veil.$test"
          done
      - name: Package game and independent updater bootstrap
        run: |
          set -euo pipefail
          printf 'Main-Class: veil.MaleficVeil\n' > build/manifest.mf
          jar cfm build/package/MaleficVeil.jar build/manifest.mf -C build/classes .
          jar uf build/package/MaleficVeil.jar -C assets/game kenney
          jar uf build/package/MaleficVeil.jar -C assets/game ggbot
          mkdir -p build/bootstrap/veil
          cp build/classes/veil/DesktopUpdater*.class build/bootstrap/veil/
          cp build/classes/veil/ReleaseCatalog*.class build/bootstrap/veil/
          jar cf build/package/updater.jar -C build/bootstrap .
          mkdir -p build/package/assets
          cp -R assets/game build/package/assets/
          cp -R lib build/package/
          cp play-release.bat play-release.sh build/package/
          chmod +x build/package/play-release.sh
          printf '%s\n' "$GITHUB_SHA" > build/package/version.txt
          cd build/package
          zip -qr "MaleficVeil-${GITHUB_SHA:0:12}.zip" MaleficVeil.jar updater.jar assets lib version.txt
          zip -qr "MaleficVeil-desktop-${GITHUB_SHA:0:12}.zip" MaleficVeil.jar updater.jar assets lib version.txt play-release.bat play-release.sh
          unzip -tq "MaleficVeil-${GITHUB_SHA:0:12}.zip"
          unzip -tq "MaleficVeil-desktop-${GITHUB_SHA:0:12}.zip"
          sha256sum "MaleficVeil-${GITHUB_SHA:0:12}.zip" | awk '{print $1}' > checksum.txt
          printf 'version=%s\narchive=MaleficVeil-%s.zip\nsha256=%s\n' "$GITHUB_SHA" "${GITHUB_SHA:0:12}" "$(cat checksum.txt)" > update.properties
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dev-${GITHUB_SHA:0:12}"
          gh release create "$TAG" \
            "build/package/MaleficVeil-${GITHUB_SHA:0:12}.zip" \
            "build/package/MaleficVeil-desktop-${GITHUB_SHA:0:12}.zip" \
            build/package/update.properties \
            build/package/updater.jar \
            build/package/play-release.bat \
            build/package/play-release.sh \
            --target "$GITHUB_SHA" \
            --title "The Malefic Veil ${GITHUB_SHA:0:12}" \
            --notes "Pre-1.0 development build $GITHUB_SHA. Updater includes published prereleases; save compatibility is not guaranteed." \
            --prerelease
      - name: Verify published release and downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dev-${GITHUB_SHA:0:12}"
          gh release view "$TAG" --json tagName,isDraft,isPrerelease --jq '.tagName == "'$TAG'" and .isDraft == false and .isPrerelease == true' | grep -qx true
          mkdir -p build/release-readback
          gh release download "$TAG" -D build/release-readback
          for file in "MaleficVeil-${GITHUB_SHA:0:12}.zip" \
                      "MaleficVeil-desktop-${GITHUB_SHA:0:12}.zip" \
                      updater.jar update.properties play-release.bat play-release.sh; do
            cmp "build/package/$file" "build/release-readback/$file"
          done
          unzip -tq "build/release-readback/MaleficVeil-desktop-${GITHUB_SHA:0:12}.zip"
          echo "Published prerelease and all downloaded assets verified"
      - name: Install newest published development update from live GitHub
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/update-smoke/worlds/keep-this-world
          printf 'previous save must remain untouched\n' > build/update-smoke/worlds/keep-this-world/save.dat
          printf '%040d\n' 0 > build/update-smoke/version.txt
          java -Djava.awt.headless=true -cp build/package/updater.jar \
            veil.DesktopUpdater "$PWD/build/update-smoke" --install
          grep -q INSTALL_VERIFIED build/update-smoke/logs/updater.log
          test -s build/update-smoke/MaleficVeil.jar
          test -s build/update-smoke/updater.jar
          test -s build/update-smoke/lib/shared-psx-weather-java17-v1.jar
          test -d build/update-smoke/assets/game
          test "$(cat build/update-smoke/worlds/keep-this-world/save.dat)" = "previous save must remain untouched"
          java -Djava.awt.headless=true -cp build/update-smoke/MaleficVeil.jar veil.WorldSelfTest
          echo "Live GitHub prerelease discovery, download, install, and rollback-safe save preservation PASS"
      - name: Upgrade an actual previously published desktop installation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="dev-${GITHUB_SHA:0:12}"
          PREVIOUS="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq             '.[] | select(.draft == false and .prerelease == true) | .tag_name' |
            grep -v "^$CURRENT$" | head -n 1 || true)"
          if [ -z "$PREVIOUS" ]; then
            echo "No previous prerelease exists yet; fresh-install smoke is the bootstrap gate"
            exit 0
          fi
          mkdir -p build/previous-release build/previous-install
          gh release download "$PREVIOUS" --pattern 'MaleficVeil-desktop-*.zip' \
            --dir build/previous-release
          unzip -q build/previous-release/MaleficVeil-desktop-*.zip -d build/previous-install
          test -s build/previous-install/updater.jar
          BEFORE="$(cat build/previous-install/version.txt)"
          mkdir -p build/previous-install/worlds/older-save
          echo 'retain-save-file' > build/previous-install/worlds/older-save/state.txt
          cp build/previous-install/updater.jar build/previous-updater.jar
          java -Djava.awt.headless=true -cp build/previous-updater.jar \
            veil.DesktopUpdater "$PWD/build/previous-install" --install
          grep -q INSTALL_VERIFIED build/previous-install/logs/updater.log
          AFTER="$(cat build/previous-install/version.txt)"
          test "$AFTER" != "$BEFORE"
          test -s build/previous-install/MaleficVeil.jar
          test -s build/previous-install/updater.jar
          test -s build/previous-install/lib/shared-psx-weather-java17-v1.jar
          test "$(cat build/previous-install/worlds/older-save/state.txt)" = retain-save-file
          echo "Existing release $PREVIOUS updated to $AFTER via installed updater: PASS"
      - name: Preserve packaged installer even if Release API denies publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malefic-desktop-${{ github.sha }}
          path: |
            build/package/MaleficVeil-desktop-*.zip
            build/package/MaleficVeil-*.zip
            build/package/update.properties
            build/package/updater.jar
          if-no-files-found: warn
