name: GPU Kenney PSX client

on:
  push:
    branches: [main]
    paths:
      - 'gpu-client/**'
      - 'src/main/java/veil/**'
      - 'assets/game/kenney/**'
      - '.github/workflows/gpu-client.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: gpu-client/pom.xml
      - name: Acquire verified GGBot CC0 car atlas source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/game/ggbot
          curl -fL --retry 3 'https://opengameart.org/sites/default/files/psx_style_cars_by_ggbot_august2023.zip' -o assets/game/ggbot/psx-style-cars.zip
          echo 'db67b0b0fbaa02454a5d000dc9ec1cc53f360e8f41ab44f3fb1c7e8f71e699e4  assets/game/ggbot/psx-style-cars.zip' | sha256sum -c -
      - name: Verify deterministic sky cycle and asset-sourced streetlight bounds
        shell: bash
        run: |
          mkdir -p build/classes
          javac --release 17 -encoding UTF-8 -d build/classes src/main/java/veil/*.java
          java -cp build/classes veil.WorldDayNightTest
          java -cp build/classes veil.UrbanLightingTest
      - name: Build self-contained GPU desktop JAR
        shell: bash
        run: |
          mvn -B -ntp -f gpu-client/pom.xml -DskipTests package
          test -s gpu-client/target/MaleficVeil-GPU.jar
          jar tf gpu-client/target/MaleficVeil-GPU.jar | grep 'veil/gpu/GpuKenneyPreview.class'
          jar tf gpu-client/target/MaleficVeil-GPU.jar | grep 'kenney/retro-urban-kit-2.0.zip'
          jar tf gpu-client/target/MaleficVeil-GPU.jar | grep 'ggbot/psx-style-cars.zip'
      - name: Prepare Mesa OpenGL and virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Run real OpenGL instanced-draw screenshot test
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p build/test-visuals
          xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' \
            timeout 90s java -Djava.awt.headless=false -jar gpu-client/target/MaleficVeil-GPU.jar --smoke
          test -s build/test-visuals/gpu-kenney-city.png
          test -s build/test-visuals/gpu-kenney-night.png
          test -s build/test-visuals/gpu-psx-menu.png
          test -s build/test-visuals/gpu-continental-edge.png
          test -s build/test-visuals/gpu-kenney-vehicles.png
          test -s build/test-visuals/gpu-kenney-foliage.png
          file build/test-visuals/gpu-kenney-city.png
      - name: Three seeded real GPU worlds, six in-game camera angles each
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          for seed in 20261020 42 887766; do
            xvfb-run -a -s '-screen 0 1280x720x24 +extension GLX' \
              timeout 150s java -Djava.awt.headless=false \
              -jar gpu-client/target/MaleficVeil-GPU.jar --gallery --seed="$seed" \
              | tee "build/test-visuals/gallery-seed-$seed.log"
            test "$(grep -c 'GALLERY_CAPTURE seed=' "build/test-visuals/gallery-seed-$seed.log")" -eq 6
            test "$(find build/test-visuals -maxdepth 1 -name "gallery-seed-$seed-*.png" | wc -l)" -eq 6
          done
          printf 'Real OpenGL world gallery: 3 seeds x 6 camera poses = 18 PNGs\n'
          file build/test-visuals/gallery-seed-*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: malefic-gpu-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            gpu-client/target/MaleficVeil-GPU.jar
            build/test-visuals/gpu-kenney-city.png
            build/test-visuals/gpu-kenney-night.png
            build/test-visuals/gpu-psx-menu.png
            build/test-visuals/gpu-continental-edge.png
            build/test-visuals/gpu-kenney-vehicles.png
            build/test-visuals/gpu-kenney-foliage.png
            build/test-visuals/gallery-seed-*.png
            build/test-visuals/gallery-seed-*.log
          if-no-files-found: warn
