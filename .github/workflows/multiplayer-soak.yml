name: Multiplayer soak and edge scenarios

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/main/java/veil/**'
      - 'src/main/java/dev/mrcalzon/water/**'
      - '.github/workflows/multiplayer-soak.yml'

permissions:
  contents: read

jobs:
  host-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile host and all test clients
        run: |
          mkdir -p build/classes
          javac --release 17 -encoding UTF-8 -d build/classes src/main/java/veil/*.java src/main/java/dev/mrcalzon/water/*.java
      - name: Repeated independent host/game startup and combat
        run: |
          set -eu
          for i in $(seq 1 12); do
            echo "::group::Host session $i"
            timeout 35s java -Djava.awt.headless=true -cp build/classes veil.LanSmokeTest
            timeout 35s java -Djava.awt.headless=true -cp build/classes veil.ArenaSystemsTest
            echo "::endgroup::"
          done
      - name: Licensed 124-model archive import and renderer regression
        run: java -Djava.awt.headless=true -cp build/classes veil.UrbanAssetTest
      - name: Run 18 gameplay mesh and visibility tests
        run: java -Djava.awt.headless=true -cp build/classes veil.GameplayAssetTest
      - name: Seeded city collision and spawn properties
        run: java -Djava.awt.headless=true -cp build/classes veil.WorldSelfTest
