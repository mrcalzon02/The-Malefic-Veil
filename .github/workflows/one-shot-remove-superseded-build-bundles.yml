name: Remove pinned obsolete bundles
on:
  schedule:
    - cron: '1,6,11,16,21 19 25 11 *'
permissions:
  actions: write
concurrency:
  group: one-shot-remove-pinned-old-builds
  cancel-in-progress: false
jobs:
  remove_exact_old_builds:
    if: >-
      github.repository == 'mrcalzon02/The-Malefic-Veil' && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Delete pinned artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(date -u +%F)" == "2026-11-25" ]] || exit 0
          base=repos/mrcalzon02/The-Malefic-Veil/actions
          pins=(
            '45050456056|14766090616|malefic-desktop-cf6ef1c84a770e93c3a7b19250a827bce6ce4b77'
            '45050456056|14765566590|malefic-native-setup-cf6ef1c84a770e93c3a7b19250a827bce6ce4b77'
          )
          found=()
          for row in "${pins[@]}"; do
            IFS='|' read -r run id name <<< "$row"
            prior=$(gh api "$base/runs/$run/artifacts?per_page=100")
            any=$(jq --argjson id "$id" '[.artifacts[] | select(.id == $id)] | length' <<< "$prior")
            if [[ "$any" == 0 ]]; then continue; fi
            jq -e --argjson id "$id" --arg name "$name" '[.artifacts[] | select(.id == $id and .name == $name)] | length == 1' <<< "$prior" >/dev/null
            found+=("$id")
          done
          for id in "${found[@]}"; do
            gh api --method DELETE "$base/artifacts/$id" --silent
            echo "Deleted obsolete artifact $id"
          done
          for row in "${pins[@]}"; do
            IFS='|' read -r run id name <<< "$row"
            gh api "$base/runs/$run/artifacts?per_page=100" | jq -e --argjson id "$id" '[.artifacts[] | select(.id == $id)] | length == 0' >/dev/null
          done
          echo "Verified all pinned old artifacts are absent."
